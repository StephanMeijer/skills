name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify the README table matches skills/
        shell: bash
        run: |
          bt="$(printf '\140')"
          diff <(ls skills) <(grep -oE "^\| ${bt}[^ |]+" README.md | tr -d "| ${bt}" | sort)
      - name: Verify every relative Markdown link resolves
        shell: bash
        run: |
          set -euo pipefail
          # Relative .md links only: ':' skips URLs and mailto, '<' skips placeholders.
          # grep exits 1 on no match; any other failure fails the step.
          hits="$(grep -roE '\]\([^)#:<]+\.md[)#]' skills --include='*.md')" || [ "$?" -eq 1 ]
          status=0
          while IFS= read -r hit; do
            file="${hit%%:*}"
            target="${hit#*:](}"
            target="${target%?}"
            if [ ! -e "$(dirname "$file")/$target" ]; then
              echo "::error file=$file::links to missing $target"
              status=1
            fi
          done <<< "$hits"
          exit "$status"
      - name: Verify every skill installs
        shell: bash
        run: |
          set -euo pipefail

          source_root="$GITHUB_WORKSPACE"
          qa_root="$(mktemp -d)"

          cd "$qa_root"
          npx --yes skills@1.7.6 add "$source_root" --skill '*' --agent codex --copy --yes

          for skill_file in "$source_root"/skills/*/SKILL.md; do
            skill_name="$(basename "$(dirname "$skill_file")")"
            installed_file="$qa_root/.agents/skills/$skill_name/SKILL.md"

            test -f "$installed_file"
            cmp "$skill_file" "$installed_file"
          done

          source_count="$(find "$source_root/skills" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)"
          installed_count="$(find "$qa_root/.agents/skills" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)"
          test "$source_count" -eq "$installed_count"
